# Projects

- project: Custom GitHub Action
  role: Developer
  duration: false
  description: |
    I created a custom [GitHub Action](https://github.com/woocommerce/grow/tree/trunk/packages/github-actions/actions/hook-documentation)
    to document WordPress hooks within a codebase and generate a markdown file. This action is can be used by WordPress plugin
    developers to automatically generate documentation for their plugins.

- project: Order Attribution for WooCommerce
  role: Developer
  duration: false
  description: |
    The [Order Attribution](https://github.com/woocommerce/woocommerce-order-source-attribution) feature for WooCommerce
    allows store owners to track the source of their orders. This is useful for determining which marketing channels are
    most effective.

    This feature was first developed as a standalone plugin, and then it was later integrated directly into the
    core WooCommerce codebase. I played a key role in development in both phases of this project.

- project: Google Listings and Ads
  role: Developer
  duration: false
  description: |
    In a partnership with Google, I worked to develop the plugin architecture for the
    [Google Listings and Ads](https://github.com/woocommerce/google-listings-and-ads) extension. The purpose of
    this extension is to integrate WooCommerce shops with the Google Merchant Center.
    
    The architecture of this extension was designed to take advantage of modern PHP practices within a WordPress plugin,
    and borrows ideas from both WooCommerce core and other modern plugin developers. One of the design goals was to
    limit repetition in the codebase, and to compartmentalize the code into small, easily testable units.

- project: WooCommerce Subscriptions Limited Recurring Coupons
  role: Developer
  duration: false
  description: |
    [Limited payment coupons](https://docs.woocommerce.com/document/subscriptions/limited-payment-coupon-guide/)
    allow store managers to create coupons that apply to a certain number of subscription payments.

    Limited coupons are coupons that will apply a discount for a limited number of payments. For example,
    if a store manager wants only the first three months of a monthly subscription to be discounted,
    they could use this feature to create a coupon that applies to three payments.

- project: Yikes, Inc Easy Mailchimp Extender V3 API
  role: Consultant
  duration: false
  description: |
    A WordPress plugin that allows you to easily add MailChimp sign up forms to your site.

    I was brought on as a consultant to update the codebase to utilize version 3 of
    [MailChimp's API](https://developer.mailchimp.com). All of the details of this effort
    are [available on GitHub](https://github.com/yikesinc/yikes-inc-easy-mailchimp-extender/issues/462).

- project: WP CLI for WP Engine
  role: Developer
  duration: false
  description: |
    Created a custom package of [WP CLI](http://wp-cli.org) that is able to run in the
    WP Engine environment. I also set up security for WP CLI to ensure that individual clients
    can access their own sites but not the sites of neighbors.

    The custom packaging of WP CLI involved reengineering the WP CLI build process to build a
    custom PHAR that could switch to the necessary AppArmor profile for customer sites.

- project: Multisite Conversion script
  role: Developer
  duration: false
  description: |
    Converting a WordPress site to Multisite required many steps on the WP Engine platform. I developed
    a CLI utility that would automate all of the steps and free up significant time for WP Engine
    support specialists.
