# Site settings
title: Jeremy Pry Resume
description: Jeremy Pry's skills and work experience.
host: resume.jpry.com
baseurl: /

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
exclude:
  - README.md
  - Gemfile*
  - .idea

# Resume settings
resume_avatar: 84552f74b71a1a3e6aae380aa9ab3bd3
resume_name: Jeremy Pry
resume_title: Software Engineer
resume_contact_email: resume@jpry.com
resume_header_contact_info: "Hartsville, TN | 484.693.0789 | resume@jpry.com | "
resume_header_intro: >
  Results-driven Software Engineer and WordPress Developer known for leveraging expert knowledge in WordPress
  best practices and general development design to deliver high-impact solutions. Proven track record of success
  collaborating seamlessly within distributed development teams to drive project success. Passionate about
  creating innovative and scalable software solutions that optimize user experiences and exceed client expectations.


# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work: "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:   true
resume_section_education:    true
resume_section_projects:     false
resume_section_skills:       true
resume_section_recognition:  false
resume_section_links:        true
resume_section_associations: false

# Configure the labels for each section
resume_section_labels:
  contact: Contact Me
  skills: Key Skills
  projects: Projects
  social-links: Social Links
  links: Additional Links
  associations: Associations
  recognition: Recognition
  education: Education
  experience: Professional Experience

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url: https://github.com/JPry
  resume_twitter_url: https://twitter.com/JPry
  #  resume_facebook_url:
  resume_linkedin_url: https://www.linkedin.com/in/jeremypry/
  #  resume_instagram_url:
  resume_website_url: https://jeremypry.com/
resume_print_social_links: false

# Design settings
resume_theme: default

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "resume"
      show_contact_button: true
